name: Shopify order sync recovery sweep

# Formerly the 5-minute recovery sweep; superseded by a pg_cron job running directly inside
# Supabase's own Postgres instance (see the one-off setup script), which is NOT subject to
# GitHub's free-tier scheduling throttling -- confirmed empirically: this workflow's own scheduled
# runs ended up roughly 2+ hours apart despite a 5-minute cron expression, while pg_cron fires
# within a second of every scheduled tick. The automatic schedule trigger is removed to avoid
# running two schedulers for the same job; workflow_dispatch is kept so this can still be run
# manually (e.g. as an emergency fallback if the Supabase-side job is ever disabled).
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call reconciliation endpoint
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.EXTERNAL_CRON_SECRET }}" \
            https://www.jawhara.se/api/cron/sync-orders)
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -ge 300 ]; then
            echo "Reconciliation call failed"
            exit 1
          fi
